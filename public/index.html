<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   jocarsa | iu mejorado
  </title>
  
  <link href="css/estilo.css" rel="stylesheet"/>
 </head>
 <body class="jocarsa-iu">
  <header>
   <div class="corporativo">
    
    <h1>
     jocarsa | iu mejorado
    </h1>
   </div>
   <div id="herramientas">
    <input id="buscador" placeholder="Buscar solicitudes…" type="search"/>
    <button id="nuevo">
     + Nuevo
    </button>
   </div>
   <div id="usuario">
    <div class="imagen">
    </div>
    <div>
     <p>
      Usuario de demostración
     </p>
     <a href="#formulario">
      Formulario
     </a>
    </div>
   </div>
  </header>
  <main>
   <nav id="navegacion">
    <div class="titulo-columna">
     Módulos
    </div>
    <div class="contenido-columna">
    </div>
    <button class="minimizar" title="Minimizar">
     ◀
    </button>
   </nav>
   <div class="separador" data-left="navegacion">
   </div>
   <section id="entidades">
    <div class="titulo-columna">
     Vistas
    </div>
    <div class="contenido-columna">
    </div>
    <button class="minimizar" title="Minimizar">
     ◀
    </button>
   </section>
   <div class="separador" data-left="entidades">
   </div>
   <div class="escenario" id="escenario">
   </div>
  </main>
  <template id="tpl-nav">
   <a href="#">
    <span class="ficha">
    </span>
    <span class="etiqueta">
    </span>
   </a>
  </template>
  <template id="tpl-card">
   <article draggable="true">
    <span class="ficha">
    </span>
    <span class="etiqueta">
    </span>
   </article>
  </template>
  <template id="tpl-fila">
   <tr>
   </tr>
  </template>
  <script src="js/componentes.js">
  </script>
 </body>
</html>
